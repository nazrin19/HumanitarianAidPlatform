<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account · Humanitarian Aid Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F1F5F8; --panel:#DCF4E7; --card:#FFFFFF; --ink:#121B26; --muted:#5F6B7A; --line:#D5DBE3;
  --green:#1A603E; --green-hover:#144D31; --field:#FFFFFF; --err:#C62828;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.shell{width:100%;max-width:1080px;min-height:690px;background:var(--card);border-radius:28px;overflow:hidden;
  box-shadow:0 18px 50px rgba(18,32,58,.12);display:grid;grid-template-columns:1fr 1fr}
.left{background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:36px 36px 34px}
.brand{align-self:flex-start;display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-.01em;padding-left:8px;color:#234B3C;white-space:nowrap}
.brand svg{width:50px;height:50px;flex:none}
.art{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;margin-top:4px}
.art img{display:block;width:100%;max-width:470px;height:auto;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
.left h2{margin:14px 0 12px;text-align:center;font-size:38px;line-height:1.14;font-weight:700;letter-spacing:-.02em;max-width:360px}
.left p{margin:0 0 26px;text-align:center;font-size:17px;line-height:1.5;max-width:380px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#B9CDC2}
.dots i:first-child{width:18px;border-radius:4px;background:var(--green)}
.right{display:flex;flex-direction:column;padding:36px 44px 40px}
.have{align-self:flex-end;font-size:15px;margin:10px 0 0}
a{color:var(--green);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
.form{width:100%;max-width:374px;margin:auto;padding:12px 0 0}
h1{margin:0 0 6px;text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em}
.sub{margin:0 0 26px;text-align:center;font-size:15px;color:var(--ink)}
label{display:block;font-size:15px;font-weight:500;margin:0 0 7px}
.field{position:relative;margin-bottom:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input[type=text],input[type=email],input[type=password]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--field);
  color:var(--ink);font:inherit;font-size:15px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#7C8795}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(26,96,62,.16)}
input[aria-invalid="true"]{border-color:var(--err)}
.pw input{padding-right:42px}
.eye{position:absolute;right:6px;bottom:3px;width:36px;height:36px;border:0;background:none;border-radius:8px;color:#5F6B7A;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--green)}
.eye svg{width:19px;height:19px}
.terms{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;margin:2px 0 18px;font-weight:400}
.terms input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:2px 0 0;border:1.5px solid #AEB7C2;border-radius:4px;background:#fff;cursor:pointer;display:grid;place-items:center}
.terms input:checked{background:var(--green);border-color:var(--green)}
.terms input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.terms a{font-weight:500}
.error{min-height:20px;font-size:13px;color:var(--err);margin:-6px 0 8px;text-align:center}
.btn{width:100%;height:46px;border:0;border-radius:8px;background:var(--green);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 10px rgba(26,96,62,.22);transition:background .15s}
.btn:hover{background:var(--green-hover)}
a:focus-visible,button:focus-visible,.terms input:focus-visible{outline:3px solid rgba(26,96,62,.5);outline-offset:2px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;min-height:0}
  .left{display:none}
  .right{padding:24px 20px 32px}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      <p class="sub">Get started by filling out your details below.</p>
      <form id="f" novalidate>
        <div class="field">
          <label for="n">Full Name</label>
          <input id="n" type="text" autocomplete="name" placeholder="Type your name">
        </div>
        <div class="field">
          <label for="m">Email Address</label>
          <input id="m" type="email" autocomplete="email" placeholder="Type email address">
        </div>
        <div class="row">
          <div class="field pw">
            <label for="p1">Password</label>
            <input id="p1" type="password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button class="eye" type="button" data-for="p1" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
          </div>
          <div class="field pw">
            <label for="p2">Confirm Password</label>
            <input id="p2" type="password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button class="eye" type="button" data-for="p2" aria-label="Show confirm password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
          </div>
        </div>
        <label class="terms"><input id="c" type="checkbox"><span>By creating an account, you agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a></span></label>
        <div class="error" id="e" role="alert"></div>
        <button class="btn" type="submit">Create Account</button>
      </form>
    </div>
  </section>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var f=$('f'),e=$('e'),ids=['n','m','p1','p2','c'];
  document.querySelectorAll('.slash').forEach(function(s){s.style.display='none'});
  document.querySelectorAll('.eye').forEach(function(b){
    b.addEventListener('click',function(){
      var i=$(b.dataset['for']),show=i.type==='password',s=b.querySelector('.slash');
      i.type=show?'text':'password';s.style.display=show?'block':'none';
      b.setAttribute('aria-label',(show?'Hide ':'Show ')+(i.id==='p2'?'confirm password':'password'));
    });
  });
  function fail(id,msg){$(id).setAttribute('aria-invalid','true');e.style.color='var(--err)';e.textContent=msg;$(id).focus();}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    ids.forEach(function(i){$(i).removeAttribute('aria-invalid')});e.textContent='';
    if(!$('n').value.trim())return fail('n','Enter your full name.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('m').value.trim()))return fail('m','Enter a valid email address.');
    if($('p1').value.length<8)return fail('p1','Use at least 8 characters for your password.');
    if($('p1').value!==$('p2').value)return fail('p2','Passwords do not match.');
    if(!$('c').checked)return fail('c','Agree to the Terms of Service and Privacy Policy to continue.');
    e.style.color='var(--green)';e.textContent='Account created. Welcome to the community!';
  });
})();
</script>
</body>
</html>
